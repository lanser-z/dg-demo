# Lineage Recipe Configuration
# Defines upstream lineage relationships for DataHub/GMS ingestion
#
# 角色定位（Phase 2 / 模块 6.9 升级后）：
#   **本文件是「业务跨系统 JOIN」与「未自动覆盖边」的兜底通道**，
#   不再是 Demo 血缘的唯一来源。
#
# 写入方式（scripts/emit_lineage.py）：用 DatahubRestEmitter + MCP + UpstreamLineageClass，
# 经 POST /aspects?action=ingestProposal 写入 GMS。
#
# 双通道并存（auto 通道为主，manual 通道兜底）：
#   - auto 通道：src/dg_platform/lineage_emitter.py 上下文管理器，ETL 任务
#     跑完 emit OpenLineage 事件到 GMS（/openapi/openlineage/api/v1/lineage），
#     GMS 内部 OpenLineageToDataHub 转换器写 dataJobInputOutput aspect。
#   - manual 通道：本 YAML + emit_lineage.py，跨系统业务关系（业务键 JOIN
#     不可 SQL 解析的场景）走这里；直接写 upstreamLineage aspect。
#   - 去重：DataHub graph 服务按 (dataset, upstream) 唯一键合并，UI 不重复。
#
# 血缘分两类（DataHub Upstream.type 统一为 TRANSFORMED，语义区分靠 description）：
#   - 业务血缘（business_lineage）：跨系统按业务语义关联（非字面 JOIN）
#   - 加工血缘（processing_lineage）：ODS→DWD / DWD→DWA 的 ETL 派生
#
# 共 8 条有 upstream 的边（另有源头节点 upstream=null 不计入边）。

gms:
  url: "http://localhost:28080"
  auth: "datahub:datahub"

# Lineage relationships
# format: downstream ← upstream (downstream 依赖 upstream)
lineage_relationships:
  # ── 源头节点（upstream=null，仅声明存在，不产生血缘边） ──
  - downstream:
      platform: sap_erp
      table: vbak
    upstream: null
    description: "SAP 销售订单抬头 — 源头表"

  - downstream:
      platform: sap_erp
      table: vbap
    upstream: null
    description: "SAP 销售订单行项目 — 源头表"

  - downstream:
      platform: pi_system
      table: tags
    upstream: null
    description: "PI System 时序标签 — 源头表"

  # ── 业务血缘（跨系统，声明式关系，非可执行 JOIN） ──
  # 注意：lims.samples 无 KUNNR 列，sap_erp.vbak 无 MINE_CODE 列，两表无字面共享列。
  # 此边表达「客户订购的煤，其质量曾在某矿井化验」的业务语义，
  # 真实跨系统关联键（矿井 MINE_CODE）不在 vbak，属 Phase 2 / 模块七主数据标准化范围。
  - downstream:
      platform: lims
      table: samples
    upstream:
      - platform: sap_erp
        table: vbak
      - platform: sap_erp
        table: vbap
    type: business_lineage
    description: "声明式业务关系：销售订单(vbak/vbap)对应的煤其质量由 LIMS 样品化验；两表无字面共享列，非可执行 JOIN（数据孤岛）"

  # ── 加工血缘（ODS → DWD 清洗） ──
  - downstream:
      platform: dwd
      table: vbak
    upstream:
      - platform: sap_erp
        table: vbak
    type: processing_lineage
    description: "DWD 清洗后销售订单抬头（去空/去重/规范化）"

  - downstream:
      platform: dwd
      table: tags
    upstream:
      - platform: pi_system
        table: tags
    type: processing_lineage
    description: "DWD 清洗后 PI 时序标签"

  - downstream:
      platform: dwd
      table: samples
    upstream:
      - platform: lims
        table: samples
    type: processing_lineage
    description: "DWD 清洗后 LIMS 样品"

  # ── 加工血缘（DWD/ODS → DWA 汇总，由 build_dwa_models.py 真实派生） ──
  # 3 条 DWA 边声明 columnMappings 字段（列级血缘），
  # emit_lineage.py 会读取并以 fineGrainedLineages 写入 GMS upstreamLineage aspect。
  # 字段映射以 Parquet schema 为准（不凭空猜测）：
  #   - dwa_sales_daily 来源 dwd.vbak (vbak) — VBELN/ERDAT/ERZET/ERNAM/AUART/KUNNR/NETWR/...
  #   - dwa_tag_alarm 来源 pi_system.tags — tag/timestamp/value/status/mine/face
  #   - dwa_coal_quality 来源 lims.samples — SAMPLE_ID/MINE_CODE/.../AD/VD/全硫St/QGR_AD/...
  - downstream:
      platform: dwa
      table: dwa_sales_daily
    upstream:
      - platform: dwd
        table: vbak
    type: processing_lineage
    description: "DWA 每日销售汇总宽表（GROUP BY ERDAT，COUNT/SUM，来自 dwd_vbak）"
    columnMappings:
      - downstream_column: sale_date
        upstream_column: ERDAT
        transformation: "STRFTIME(CAST(ERDAT AS DATE), '%Y-%m-%d')"
      - downstream_column: order_count
        upstream_column: "*"
        transformation: "COUNT(*)"
      - downstream_column: customer_count
        upstream_column: KUNNR
        transformation: "COUNT(DISTINCT KUNNR)"
      - downstream_column: total_amount
        upstream_column: NETWR
        transformation: "SUM(NETWR)"
      - downstream_column: avg_order_amount
        upstream_column: NETWR
        transformation: "AVG(NETWR)"
      - downstream_column: order_type_count
        upstream_column: AUART
        transformation: "COUNT(DISTINCT AUART)"
      - downstream_column: sales_org_count
        upstream_column: VKORG
        transformation: "COUNT(DISTINCT VKORG)"

  - downstream:
      platform: dwa
      table: dwa_tag_alarm
    upstream:
      - platform: pi_system
        table: tags
    type: processing_lineage
    description: "DWA 传感器告警汇总宽表（按标签聚合告警次数，来自 pi_system.tags）"
    columnMappings:
      - downstream_column: mine
        upstream_column: mine
        transformation: "直接映射"
      - downstream_column: face
        upstream_column: face
        transformation: "直接映射"
      - downstream_column: tag
        upstream_column: tag
        transformation: "直接映射"
      - downstream_column: total_records
        upstream_column: "*"
        transformation: "COUNT(*)"
      - downstream_column: missing_count
        upstream_column: status
        transformation: "SUM(CASE WHEN status = -1 THEN 1 ELSE 0 END)"
      - downstream_column: high_value_count
        upstream_column: value
        transformation: "SUM(CASE WHEN value > 8000 THEN 1 ELSE 0 END)"
      - downstream_column: avg_value
        upstream_column: value
        transformation: "AVG(value)"
      - downstream_column: stddev_value
        upstream_column: value
        transformation: "STDDEV(value)"
      - downstream_column: min_value
        upstream_column: value
        transformation: "MIN(value)"
      - downstream_column: max_value
        upstream_column: value
        transformation: "MAX(value)"

  - downstream:
      platform: dwa
      table: dwa_coal_quality
    upstream:
      - platform: lims
        table: samples
    type: processing_lineage
    description: "DWA 月度煤质汇总宽表（按矿井/煤种/月聚合灰分热值，来自 lims.samples）"
    columnMappings:
      - downstream_column: MINE_CODE
        upstream_column: MINE_CODE
        transformation: "直接映射"
      - downstream_column: MINE_NAME
        upstream_column: MINE_NAME
        transformation: "直接映射"
      - downstream_column: month
        upstream_column: SAMPLING_DATE
        transformation: "SUBSTR(SAMPLING_DATE, 1, 7)"
      - downstream_column: SAMPLE_TYPE
        upstream_column: SAMPLE_TYPE
        transformation: "直接映射"
      - downstream_column: sample_count
        upstream_column: "*"
        transformation: "COUNT(*)"
      - downstream_column: avg_ash_content
        upstream_column: AD
        transformation: "AVG(AD)"
      - downstream_column: avg_volatile_content
        upstream_column: VD
        transformation: "AVG(VD)"
      - downstream_column: avg_sulfur_content
        upstream_column: 全硫St
        transformation: "AVG(全硫St)"
      - downstream_column: avg_gross_calorific
        upstream_column: QGR_AD
        transformation: "AVG(QGR_AD)"
      - downstream_column: min_ash_content
        upstream_column: AD
        transformation: "MIN(AD)"
      - downstream_column: max_ash_content
        upstream_column: AD
        transformation: "MAX(AD)"
      - downstream_column: lab_count
        upstream_column: TEST_LAB
        transformation: "COUNT(DISTINCT TEST_LAB)"
