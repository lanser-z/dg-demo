# A 公司煤炭数据治理 Demo — 字段业务词典
# ────────────────────────────────────────────────────────────────────────
# 用途：NL2SQL 智能问数 / DataHub 字段语义增强 / 跨系统术语消解
#
# 数据来源：
# - 字段中文名 / 业务含义：docs/Background.md（SAP 字段命名 + 煤炭业务术语）
# - value_mappings：以 data/lakehouse/{dwd,dwa,ods}/.../*.parquet 实际值为准
#   （已用 pyarrow 读 schema + unique() 核对，无数据可查的表不填 value_mappings）
#
# 写入路径：scripts/emit_glossary.py 读本文件，调用 DataHub SDK
# （底层 POST http://localhost:28080/aspects?action=ingestProposal）
# 将每条 (table, column, business_term) 三元组写为 dataset-level
# glossaryTerms aspect 的一项 GlossaryTermAssociation，context 字段记录
# 「<table>.<column>」用于反查。
#
# URN 规范：
#   dataset:   urn:li:dataset:(urn:li:dataPlatform:{platform},{table},PROD)
#   glossary:  urn:li:glossaryTerm:a-company.coal.{category}.{term_id}
#     类别: dim 维度 / master 主数据 / code 编码 / metric 指标 / kpi 业务术语
#
# 约束：
# - 不得修改 docs/*.md
# - 不得引入新的 pip 依赖（仅用 pyyaml + 已装的 DataHub SDK + requests）
# - value_mappings 必须以实际 Parquet 数据值为准（不得凭空猜测）
# ────────────────────────────────────────────────────────────────────────

glossary:
  # ── 1. SAP-ERP VBAK 销售订单抬头（15 字段，data 已核验） ──────────────
  - platform: sap_erp
    table: vbak
    table_cn: 销售订单抬头
    columns:
      - column: VBELN
        cn_name: 销售凭证号
        description: SAP 销售订单唯一编号（10 位字符串）
        business_terms: [销售订单号, 销售单, 销售凭证]
      - column: ERDAT
        cn_name: 凭证创建日期
        description: 销售订单创建日期（YYYYMMDD）
        business_terms: [订单日期, 创建日期]
      - column: ERZET
        cn_name: 凭证创建时间
        description: 销售订单创建时间（HHMMSS）
        business_terms: [创建时间, 录入时间]
      - column: ERNAM
        cn_name: 创建人
        description: 销售订单创建者账号（如 LIISI / ZHANGSAN）
        business_terms: [录入人, 业务员]
      - column: AUART
        cn_name: 销售凭证类型
        description: 销售订单类型代码
        business_terms: [订单类型, 凭证类型]
        value_mappings:
          OR: 标准订单
          ZOR: 退回订单
          RET: 退货单
      - column: KUNNR
        cn_name: 客户编号
        description: 6 位客户主数据编码（关联 KNA1-KUNNR）
        business_terms: [客户编码, 客户号]
      - column: NETWR
        cn_name: 销售订单净金额
        description: 销售订单净额（不含税，单位：WAERK 币种）
        business_terms: [订单金额, 销售金额, 销售额]
      - column: WAERK
        cn_name: 币种
        description: 销售订单币种代码
        business_terms: [货币, 结算币种]
        value_mappings:
          CNY: 人民币
      - column: VKORG
        cn_name: 销售组织
        description: SAP 销售组织代码
        business_terms: [销售组织, 销售分公司]
        value_mappings:
          CN01: 销售一公司
          CN02: 销售二公司
          CN03: 销售三公司
      - column: VTWEG
        cn_name: 分销渠道
        description: SAP 分销渠道代码
        business_terms: [销售渠道, 分销渠道]
        value_mappings:
          "10": 直销
          "20": 分销
      - column: SPART
        cn_name: 产品组
        description: SAP 产品组代码
        business_terms: [产品组, 物料组]
        value_mappings:
          "00": 综合产品组
          "01": 煤炭产品组
          "02": 焦炭产品组
          "03": 化工产品组
      - column: BSTNK
        cn_name: 客户参考单号
        description: 客户采购单号
        business_terms: [客户单号, 采购单号]
      - column: BZIRK
        cn_name: 销售大区
        description: SAP 销售大区代码
        business_terms: [销售大区, 区域代码]
        value_mappings:
          D001: 华北大区
          D002: 东北大区
          D003: 华东大区
          D004: 华南大区
          D005: 西南大区

  # ── 2. SAP-ERP VBAP 销售订单行项目（8 字段，data 已核验） ──────────────
  - platform: sap_erp
    table: vbap
    table_cn: 销售订单行项目
    columns:
      - column: VBELN
        cn_name: 销售凭证号
        description: 关联 VBAK-VBELN 销售订单抬头编号
        business_terms: [订单号, 销售单]
      - column: POSNR
        cn_name: 行项目号
        description: 销售订单行项目编号（6 位）
        business_terms: [行号, 行项目]
      - column: MATNR
        cn_name: 物料编码
        description: SAP 物料主数据编码（关联 MARA-MATNR）
        business_terms: [物料号, 物料编码]
      - column: KWMENG
        cn_name: 销售订单数量
        description: 销售订单数量（销售单位 VRKME）
        business_terms: [订单数量, 销售数量]
      - column: VRKME
        cn_name: 销售单位
        description: 销售订单计量单位
        business_terms: [计量单位, 销售单位]
        value_mappings:
          TO: 吨
      - column: NETWR
        cn_name: 行项目净金额
        description: 销售订单行项目净额（不含税）
        business_terms: [行金额, 销售金额]
      - column: CHARG
        cn_name: 批次号
        description: SAP 批次号（连接 LIMS 煤质批次）
        business_terms: [批次, 批次号, 批号]
      - column: WERKS
        cn_name: 工厂代码
        description: SAP 工厂代码
        business_terms: [工厂, 发货工厂]
        value_mappings:
          CN01: 一矿工厂
          CN02: 二矿工厂
          CN03: 三矿工厂
      - column: LGORT
        cn_name: 库存地点
        description: SAP 库存地点代码
        business_terms: [库存地点, 库位]
        value_mappings:
          FG01: 成品一库
          FG02: 成品二库
          FG03: 成品三库
          RM01: 原料库

