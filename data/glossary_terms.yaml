        description: 传感器采集时间（ISO 格式）
        business_terms: [采集时间, 时间戳]
      - column: value
        cn_name: 传感器读数
        description: 传感器采集数值（单位视传感器类型而定）
        business_terms: [测量值, 读数, 数值]
      - column: status
        cn_name: 数据状态码
        description: PI 标签数据质量码
        business_terms: [状态码, 质量码]
        value_mappings:
          "0": 正常数据
          "-1": 设备掉线
      - column: mine
