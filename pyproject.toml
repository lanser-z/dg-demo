[project]
name = "dg-demo"
version = "0.1.0"
description = "A公司异构数据模拟器 - 数据治理演示环境"
requires-python = ">=3.10"
dependencies = [
    # ── 数据处理 ──────────────────────────
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    # ── 数据湖 ────────────────────────────
    "pyspark>=3.4",
    "deltalake>=0.12,<1.0",
    "duckdb>=1.0",
    # ── 数据质量 ──────────────────────────
    "great-expectations>=0.18",
    # ── 时序数据 ──────────────────────────
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    # ── 消息队列 ──────────────────────────
    "kafka-python>=2.0",
    # ── 对象存储 ──────────────────────────
    "boto3>=1.28",
    # ── OLAP ─────────────────────────────
    "pymysql>=1.1",
    # ── HTTP ─────────────────────────────
    "requests>=2.31",
    "matplotlib>=3.10.9",
    "elasticsearch>=9.4.1",
    # ── 元数据平台 ─────────────────────────
    "acryl-datahub[datahub-rest]>=0.12",
    "mysql-connector-python>=9.7.0",
    "playwright>=1.60.0",
    "networkx>=3.4.2",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    # ── 自动血缘采集（module9, Phase 2 module 9） ─────
    "openlineage-python>=1.0",
    "sqlglot>=20.0",
    "polars>=1.42.1",
    # ── 定时调度（module10, Phase 2 module 6.10） ─────
    "apscheduler>=3.10",
    "python-dotenv>=1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
    "notebook>=7.0",
    "nbconvert>=7.0",
    "nbformat>=5.9",
    "ipywidgets>=8.0",
]

[tool.dg-demo.data_scale]
sap_vbak_rows = 4_000_000
sap_vbap_ratio = 2.5
lims_rows = 2_000_000
pi_tags = 30
pi_interval_min = 10
pi_years = 2
oa_rows = 3_000_000

[tool.dg-demo.data_quality]
sap_vbak_issue_rate = 0.02
sap_vbap_issue_rate = 0.02
pi_missing_rate = 0.005
pi_outlier_rate = 0.01
lims_issue_rate = 0.02
oa_issue_rate = 0.02
